<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fbf5f1"><title>Estoque · Dindas Cake</title><link rel="stylesheet" href="/style.css"><script type="module" src="/scripts/app.js"></script></head><body data-page="stock"><main id="page-content" class="page-content">
<section class="welcome-row"><div><p class="eyebrow">SEUS PRODUTOS</p><h2>Estoque <em>organizado.</em></h2><p class="page-intro">Consulte quantidades, atualize informações e registre movimentos.</p></div><button class="button button-primary" id="add-product">＋ <span>Novo produto</span></button></section>
<section class="surface inventory-card"><div class="inventory-toolbar"><label class="search-box"><span>⌕</span><input id="search" type="search" placeholder="Buscar produto ou categoria" aria-label="Buscar produto ou categoria"></label><label class="select-label"><span>Ordenar</span><select id="sort"><option value="name">Nome (A–Z)</option><option value="quantity-desc">Maior quantidade</option><option value="quantity-asc">Menor quantidade</option></select></label></div>
<div class="table-scroll"><table><thead><tr><th>PRODUTO</th><th>CATEGORIA</th><th>QUANTIDADE</th><th>SITUAÇÃO</th><th><span class="sr-only">Ações</span></th></tr></thead><tbody id="product-rows"></tbody></table></div><div class="empty-state hidden" id="empty-stock"><span class="empty-flower">✿</span><h3>Nenhum produto por aqui ainda</h3><p>Cadastre o primeiro produto para começar a acompanhar seu estoque.</p><button class="button button-primary" id="empty-add">＋ Novo produto</button></div>
</section></main></body></html>
